name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests (with coverage floor)
        run: python -m pytest --cov --cov-fail-under=90

  real-docker:
    name: pack, ship, install (real Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests that need a daemon
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -m docker -o addopts="" -v 2>&1 | tee pytest.log || {
            # Surface the end of the log as an annotation, readable without signing in.
            echo "::error title=docker tests failed::$(tail -c 3500 pytest.log | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          }
      - name: Acceptance scenario
        run: python examples/acceptance.py --out /tmp/evidence

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit dependencies
        run: |
          python -m pip install -e . pip-audit
          pip-audit
