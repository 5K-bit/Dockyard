name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: validate (full CI)
    uses: ./.github/workflows/ci.yml

  build:
    name: build and test the package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Test the built wheel and sdist
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            python -m venv "/tmp/smoke"
            /tmp/smoke/bin/python -m pip install --quiet "$artifact"
            cd "$(mktemp -d)"   # away from the source tree, so only the installed package is used
            /tmp/smoke/bin/dockyard --version | tee /dev/stderr | grep -F "${GITHUB_REF_NAME#v}"
            /tmp/smoke/bin/python -m dockyard --version
            /tmp/smoke/bin/python -c "import dockyard.pyz as z; z.build_pyz(__import__('pathlib').Path('dockyard.pyz'))"
            /tmp/smoke/bin/python dockyard.pyz --version
            /tmp/smoke/bin/dockyard init --dir "$(mktemp -d)"
            cd "$GITHUB_WORKSPACE"
            rm -rf /tmp/smoke
          done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
